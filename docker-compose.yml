version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Auth
  # ─────────────────────────────────────────────────────────────
  auth_db:
    image: postgres:15-alpine
    container_name: rkrk_auth_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rkrk_auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Verification
  # ─────────────────────────────────────────────────────────────
  verification_db:
    image: postgres:15-alpine
    container_name: rkrk_verification_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_verification_db
    ports:
      - "5434:5432" # host 5434 → container 5432 (avoids clash with auth_db)
    volumes:
      - postgres_verification_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rkrk_verification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Catalog & Search
  # ─────────────────────────────────────────────────────────────
  catalog_db:
    image: postgres:15-alpine
    container_name: rkrk_catalog_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_catalog_db
    ports:
      - "5435:5432" # host 5435 → container 5432
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rkrk_catalog_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Booking
  # ─────────────────────────────────────────────────────────────
  booking_db:
    image: postgres:15-alpine
    container_name: rkrk_booking_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_booking_db
    ports:
      - "5436:5432" # host 5436 → container 5432
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rkrk_booking_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rkrk_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Auth gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    container_name: auth_service_app
    restart: always
    depends_on:
      auth_db:
        condition: service_healthy # ← waits for Postgres to be ready
      redis:
        condition: service_healthy
    ports:
      - "50051:50051"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: api_gateway_app
    restart: always
    depends_on:
      - auth-service
      - search-and-catalog-service
      - booking-service
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Verification gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  verification-service:
    build:
      context: .
      dockerfile: ./apps/verification/Dockerfile
    container_name: verification_service_app
    restart: always
    depends_on:
      verification_db:
        condition: service_healthy # ← waits for Postgres to be ready
      redis:
        condition: service_healthy
    ports:
      - "50052:50052"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Search & Catalog gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  search-and-catalog-service:
    build:
      context: .
      dockerfile: ./apps/search/Dockerfile
    container_name: search_catalog_service_app
    restart: always
    depends_on:
      catalog_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50055:50055"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Booking Service
  # ─────────────────────────────────────────────────────────────
  booking-service:
    build:
      context: .
      dockerfile: ./apps/booking/Dockerfile
    container_name: booking_service_app
    restart: always
    depends_on:
      booking_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

    # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Rating & Reviews
  # ─────────────────────────────────────────────────────────────
  rating_db:
    image: postgres:15-alpine
    container_name: rkrk_rating_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_rating_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_rating_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rkrk_rating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Communication
  # ─────────────────────────────────────────────────────────────
  communication_db:
    image: postgres:15-alpine
    container_name: rkrk_communication_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_communication_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_communication_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rkrk_communication_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Rating & Reviews gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  rating-service:
    build:
      context: .
      dockerfile: ./apps/rating/Dockerfile
    container_name: rating_service_app
    restart: always
    depends_on:
      rating_db:
        condition: service_healthy
      booking_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50054:50054"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Communication Service
  # ─────────────────────────────────────────────────────────────
  communication-service:
    build:
      context: .
      dockerfile: ./apps/communication/Dockerfile
    container_name: communication_service_app
    restart: always
    depends_on:
      communication_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"
      - "50056:50056"
    env_file:
      - .env.development
    environment:
      - PORT=3003
      - COMMUNICATION_DB_HOST=communication_db
      - COMMUNICATION_DB_PORT=5432
      - COMMUNICATION_DB_USER=postgres
      - COMMUNICATION_DB_PASSWORD=ashif1234
      - COMMUNICATION_DB_NAME=rkrk_communication_db
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

networks:
  rkrk_network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_verification_data:
  postgres_catalog_data:
  postgres_booking_data:
  postgres_rating_data:
  postgres_communication_data:

