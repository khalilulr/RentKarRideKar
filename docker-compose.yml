version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Auth
  # ─────────────────────────────────────────────────────────────
  auth_db:
    image: postgres:15-alpine
    container_name: rkrk_auth_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rkrk_auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Verification
  # ─────────────────────────────────────────────────────────────
  verification_db:
    image: postgres:15-alpine
    container_name: rkrk_verification_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_verification_db
    ports:
      - "5434:5432" # host 5434 → container 5432 (avoids clash with auth_db)
    volumes:
      - postgres_verification_data:/var/lib/postgresql/data
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rkrk_verification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rkrk_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - rkrk_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Auth gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    container_name: auth_service_app
    restart: always
    depends_on:
      auth_db:
        condition: service_healthy # ← waits for Postgres to be ready
      redis:
        condition: service_healthy
    ports:
      - "50051:50051"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: api_gateway_app
    restart: always
    depends_on:
      - auth-service
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Verification gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  verification-service:
    build:
      context: .
      dockerfile: ./apps/verification/Dockerfile
    container_name: verification_service_app
    restart: always
    depends_on:
      verification_db:
        condition: service_healthy # ← waits for Postgres to be ready
      redis:
        condition: service_healthy
    ports:
      - "50052:50052"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

networks:
  rkrk_network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_verification_data:
