version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────
  auth_db:
    image: postgres:15-alpine
    container_name: rkrk_auth_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashif1234
      POSTGRES_DB: rkrk_auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rkrk_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # Auth gRPC Microservice
  # ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    container_name: auth_service_app
    restart: always
    depends_on:
      - auth_db
      - redis
    ports:
      - "50051:50051"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

  # ─────────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: api_gateway_app
    restart: always
    depends_on:
      - auth-service
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - rkrk_network

networks:
  rkrk_network:
    driver: bridge

volumes:
  postgres_data: